<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout - NusaLapak</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>
if (!store.token) location.href = '/login.html';
(async () => {
  const cart = getCart();
  if (!cart.length) { mount('orders', `<h1>Checkout</h1><div class="card">Keranjang kosong. <a href="/products.html">Belanja dulu</a>.</div>`); return; }
  let lines = [], total = 0;
  for (const it of cart) {
    const { product } = await api('/api/products/' + it.product_id);
    const sub = product.price * it.qty; total += sub;
    lines.push({ ...it, product, sub });
  }
  const u = store.user || {};
  mount('orders', `<h1>Checkout</h1><div id="msg"></div>
    <div class="two-col">
      <div class="card"><strong>Data Pengiriman</strong>
        <label class="lbl">Nama penerima</label><input class="input" id="cName" value="${esc(u.name || '')}">
        <label class="lbl">No. HP</label><input class="input" id="cPhone" value="${esc(u.phone || '')}">
        <label class="lbl">Alamat lengkap</label><textarea class="input" id="cAddr" rows="3">${esc(u.address || '')}</textarea>
        <label class="lbl">Kota</label><input class="input" id="cCity" value="${esc(u.city || '')}">
        <label class="lbl">Metode bayar</label>
        <select class="input" id="cPay"><option value="transfer">Transfer bank</option><option value="ewallet">E-wallet</option><option value="cod">COD (bayar di tempat)</option></select>
        <label class="lbl">Catatan (opsional)</label><input class="input" id="cNote" maxlength="300" placeholder="Contoh: titip di satpam">
        <button class="btn btn-terra" id="btnPay" style="width:100%;margin-top:16px">Buat Pesanan - ${rupiah(total)}</button>
      </div>
      <div class="card"><strong>Ringkasan (${lines.length} item)</strong>
        <table class="tbl" style="margin-top:10px"><tbody>
        ${lines.map(l => `<tr><td>${esc(l.product.name)} x ${l.qty}</td><td style="text-align:right">${rupiah(l.sub)}</td></tr>`).join('')}
        </tbody></table>
        <div style="text-align:right;margin-top:10px">Total bayar: <strong style="font-size:20px;color:var(--terra-dark)">${rupiah(total)}</strong></div>
      </div>
    </div>`);
  document.getElementById('btnPay').onclick = async (e) => {
    e.target.disabled = true;
    try {
      const { order } = await api('/api/orders/checkout', { method: 'POST', body: {
        items: cart, recipient_name: document.getElementById('cName').value,
        phone: document.getElementById('cPhone').value, address: document.getElementById('cAddr').value,
        city: document.getElementById('cCity').value, payment_method: document.getElementById('cPay').value,
        note: document.getElementById('cNote').value } });
      setCart([]);
      location.href = '/orders.html?success=' + order.code;
    } catch (err) { document.getElementById('msg').innerHTML = alertBox(err.message); e.target.disabled = false; }
  };
})();
</script></body></html>
