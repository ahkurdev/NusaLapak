<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil - NusaLapak</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>
if (!store.token) location.href = '/login.html';
(async () => {
  const { user } = await api('/api/auth/me');
  const { orders } = await api('/api/orders/my');
  const spent = orders.filter(o => o.status !== 'batal').reduce((a, o) => a + o.total, 0);
  mount('home', `<h1>Profil Saya</h1><div id="msg"></div>
    <div class="two-col">
      <div class="card"><strong>Data Diri</strong>
        <label class="lbl">Nama</label><input class="input" id="pName" value="${esc(user.name)}">
        <label class="lbl">Email</label><input class="input" value="${esc(user.email)}" disabled>
        <label class="lbl">No. HP</label><input class="input" id="pPhone" value="${esc(user.phone || '')}">
        <label class="lbl">Alamat</label><textarea class="input" id="pAddr" rows="3">${esc(user.address || '')}</textarea>
        <label class="lbl">Kota</label><input class="input" id="pCity" value="${esc(user.city || '')}">
        <button class="btn" id="btnSave" style="width:100%;margin-top:14px">Simpan Perubahan</button>
      </div>
      <div>
        <div class="stat-grid">
          <div class="card stat"><div class="num">${orders.length}</div><small>Total order</small></div>
          <div class="card stat"><div class="num">${rupiah(spent)}</div><small>Total belanja</small></div>
          <div class="card stat"><div class="num">${esc(user.role)}</div><small>Role akun</small></div>
        </div>
        <div class="card" style="margin-top:14px"><strong>Ganti Password</strong>
          <label class="lbl">Password lama</label><input class="input" id="wOld" type="password">
          <label class="lbl">Password baru</label><input class="input" id="wNew" type="password">
          <button class="btn btn-ghost" id="btnPw" style="margin-top:12px">Ganti Password</button>
          <p style="margin-top:16px"><a href="/orders.html">Lihat riwayat transaksi</a></p>
        </div>
      </div>
    </div>`);
  document.getElementById('btnSave').onclick = async () => {
    try {
      const d = await api('/api/auth/profile', { method: 'PUT', body: { name: document.getElementById('pName').value, phone: document.getElementById('pPhone').value, address: document.getElementById('pAddr').value, city: document.getElementById('pCity').value } });
      store.user = d.user;
      document.getElementById('msg').innerHTML = alertBox('Profil tersimpan.', true);
    } catch (e) { document.getElementById('msg').innerHTML = alertBox(e.message); }
  };
  document.getElementById('btnPw').onclick = async () => {
    try {
      await api('/api/auth/password', { method: 'PUT', body: { old_password: document.getElementById('wOld').value, new_password: document.getElementById('wNew').value } });
      document.getElementById('msg').innerHTML = alertBox('Password berhasil diganti.', true);
    } catch (e) { document.getElementById('msg').innerHTML = alertBox(e.message); }
  };
})();
</script></body></html>
