<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - NusaLapak</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>
mount('home', `<div class="card" style="max-width:440px;margin:40px auto">
  <h1 style="margin-top:0">Daftar Akun</h1><div id="msg"></div>
  <label class="lbl">Nama lengkap</label><input class="input" id="rName" placeholder="Nama kamu">
  <label class="lbl">Email</label><input class="input" id="rEmail" type="email" placeholder="nama@email.com">
  <label class="lbl">Password (min. 6)</label><input class="input" id="rPass" type="password" placeholder="Password">
  <button class="btn btn-terra" id="btnReg" style="width:100%;margin-top:16px">Daftar</button>
  <p style="text-align:center">Sudah punya akun? <a href="/login.html">Masuk</a></p>
</div>`);
document.getElementById('btnReg').onclick = async () => {
  try {
    const d = await api('/api/auth/register', { method: 'POST', body: { name: document.getElementById('rName').value, email: document.getElementById('rEmail').value, password: document.getElementById('rPass').value } });
    store.token = d.token; store.user = d.user;
    location.href = '/index.html';
  } catch (e) { document.getElementById('msg').innerHTML = alertBox(e.message); }
};
</script></body></html>
