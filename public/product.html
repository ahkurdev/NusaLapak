<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detail Produk - NusaLapak</title><link rel="stylesheet" href="/css/style.css"></head><body><script src="/js/app.js"></script><script>
const id = new URLSearchParams(location.search).get('id');
(async () => {
  try {
    const { product } = await api('/api/products/' + id);
    const { reviews } = await api('/api/products/' + id + '/reviews');
    const stars = (r) => [1, 2, 3, 4, 5].map(i => `<button class="btn btn-ghost btn-small starBtn" data-v="${i}" style="${i <= r ? 'border-color:var(--terra);color:var(--terra-dark)' : ''}">${i}</button>`).join('');
    let myRating = 5;
    mount('products', `
      <p><a href="/products.html">Kembali belanja</a></p>
      <div class="detail-grid">
        <div><img src="${esc(product.image_url || '/img/p-' + product.id + '.svg')}" alt="${esc(product.name)}"></div>
        <div>
          <span class="pill">${esc(product.category ? product.category.name : 'Umum')}</span>
          <h1 style="margin:8px 0">${esc(product.name)}</h1>
          <div style="font-size:28px;color:var(--terra-dark);font-weight:800">${rupiah(product.price)}</div>
          <p style="color:var(--muted)">Rating ${product.rating || '-'} dari ${product.review_count} ulasan - Terjual ${product.sold} - <strong style="color:${product.stock > 0 ? 'var(--sage)' : 'var(--danger)'}">${product.stock > 0 ? 'Stok ' + product.stock : 'Habis'}</strong></p>
          <p>${esc(product.description)}</p>
          <div class="qty-row" style="margin:14px 0">
            <button id="qMin">-</button><strong id="qVal" style="min-width:30px;text-align:center">1</strong><button id="qPlus">+</button>
            <button class="btn btn-terra" id="btnAdd" ${product.stock < 1 ? 'disabled' : ''}>Tambah ke Keranjang</button>
          </div>
          <div id="msg"></div>
        </div>
      </div>
      <div class="section-title"><h2>Ulasan Pembeli (${reviews.length})</h2></div>
      <div class="grid" style="grid-template-columns:1fr 1fr;gap:18px" id="revGrid">
        <div>${reviews.map(r => `<div class="card" style="margin-bottom:12px"><strong>${esc(r.user_name)}</strong> <span class="pill pill-sage">${r.rating}/5</span><br><small style="color:var(--muted)">${esc(r.created_at)}</small><p style="margin:6px 0 0">${esc(r.comment || '-')}</p></div>`).join('') || '<p style="color:var(--muted)">Belum ada ulasan. Jadilah yang pertama.</p>'}</div>
        <div class="card"><strong>Tulis ulasan</strong><div id="revMsg"></div>
          <label class="lbl">Rating</label><div id="starRow" style="display:flex;gap:6px">${stars(5)}</div>
          <label class="lbl">Komentar</label><textarea class="input" id="revText" rows="3" maxlength="500" placeholder="Ceritakan pengalamanmu..."></textarea>
          <button class="btn" id="revSend" style="margin-top:12px">Kirim Ulasan</button>
        </div>
      </div>`);
    let qty = 1;
    document.getElementById('qMin').onclick = () => { qty = Math.max(1, qty - 1); document.getElementById('qVal').textContent = qty; };
    document.getElementById('qPlus').onclick = () => { qty = Math.min(product.stock, qty + 1); document.getElementById('qVal').textContent = qty; };
    document.getElementById('btnAdd').onclick = (e) => { addToCart(product.id, qty); document.getElementById('msg').innerHTML = alertBox('Ditambahkan ke keranjang.', true); };
    document.querySelectorAll('.starBtn').forEach(b => b.onclick = () => {
      myRating = Number(b.dataset.v);
      document.querySelectorAll('.starBtn').forEach(x => { x.style.borderColor = Number(x.dataset.v) <= myRating ? 'var(--terra)' : ''; x.style.color = Number(x.dataset.v) <= myRating ? 'var(--terra-dark)' : ''; });
    });
    document.getElementById('revSend').onclick = async () => {
      if (!store.token) { location.href = '/login.html'; return; }
      try {
        await api('/api/products/' + id + '/reviews', { method: 'POST', body: { rating: myRating, comment: document.getElementById('revText').value } });
        location.reload();
      } catch (e) { document.getElementById('revMsg').innerHTML = alertBox(e.message); }
    };
  } catch (e) { mount('products', alertBox(e.message)); }
})();
</script></body></html>
